<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Accordion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Accordion Example</h2>

    <div class="accordion" id="myAccordion">

        <!-- Item 1 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#section1">

                    What is Bootstrap?
                </button>

            </h2>

            <div id="section1"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">
                    Bootstrap is a popular CSS framework used for responsive web development.
                </div>

            </div>

        </div>

        <!-- Item 2 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#section2">

                    What is a Modal?
                </button>

            </h2>

            <div id="section2"
                 class="accordion-collapse collapse"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">
                    A Modal is a popup dialog box used to display content.
                </div>

            </div>

        </div>

        <!-- Item 3 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#section3">

                    What is an Accordion?
                </button>

            </h2>

            <div id="section3"
                 class="accordion-collapse collapse"
                 data-bs-parent="#myAccordion">

                <div class="accordion-body">
                    An Accordion is used to show and hide content sections.
                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
