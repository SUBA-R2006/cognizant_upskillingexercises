<!DOCTYPE html>
<html>
<head>
    <title>Display Utilities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Bootstrap Display Utilities
    </h2>

    <!-- Hidden on all screens -->
    <div class="d-none bg-danger text-white p-3 mb-3">
        This section is hidden on all devices.
    </div>

    <!-- Visible from medium screens -->
    <div class="d-none d-md-block bg-primary text-white p-3 mb-3">
        Visible only on Medium screens and above.
    </div>

    <!-- Flex layout on large screens -->
    <div class="d-none d-lg-flex bg-success text-white p-3">
        <div class="me-3">Item 1</div>
        <div class="me-3">Item 2</div>
        <div>Item 3</div>
    </div>

</div>

</body>
</html>
