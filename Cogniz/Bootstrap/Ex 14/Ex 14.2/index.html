<!DOCTYPE html>
<html>
<head>
    <title>Responsive Sidebar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 bg-primary text-white text-center p-4 d-none d-md-block">
            <h4>MENU</h4>
            <hr>

            <p>Home</p>
            <p>Courses</p>
            <p>Gallery</p>
            <p>Contact</p>
        </div>

        <!-- Content Area -->
        <div class="col-12 col-md-10 p-5">

            <h1>Welcome to My Website</h1>

            <p>
                This is the main content section. The sidebar menu appears only on tablets and larger devices.
            </p>

            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>HTML</h5>
                            <p>Learn web page structure.</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>CSS</h5>
                            <p>Style your web pages.</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>Bootstrap</h5>
                            <p>Create responsive websites.</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
