<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Groups</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Button Group Example
    </h2>

    <div class="btn-group" role="group">

        <button type="button" class="btn btn-primary">
            Home
        </button>

        <button type="button" class="btn btn-primary">
            About
        </button>

        <button type="button" class="btn btn-primary">
            Contact
        </button>

    </div>

    <hr>

    <h2 class="mb-4">
        Toggle Buttons
    </h2>

    <input type="checkbox" class="btn-check" id="check1" autocomplete="off">

    <label class="btn btn-outline-success" for="check1">
        Subscribe
    </label>

    <input type="checkbox" class="btn-check" id="check2" autocomplete="off">

    <label class="btn btn-outline-primary" for="check2">
        Notifications
    </label>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
