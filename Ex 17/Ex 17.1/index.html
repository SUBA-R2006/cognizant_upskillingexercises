<!DOCTYPE html>
<html>
<head>
    <title>Social Media Footer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center">Bootstrap Icons Example</h2>

    <p class="text-center">
        Social media icons are displayed in the footer section.
    </p>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 position-fixed bottom-0 start-0 w-100">

    <p class="mb-2">Follow Us</p>

    <a href="#" class="text-white mx-2">
        <i class="bi bi-facebook fs-4"></i>
    </a>

    <a href="#" class="text-white mx-2">
        <i class="bi bi-instagram fs-4"></i>
    </a>

    <a href="#" class="text-white mx-2">
        <i class="bi bi-twitter-x fs-4"></i>
    </a>

    <a href="#" class="text-white mx-2">
        <i class="bi bi-youtube fs-4"></i>
    </a>

    <a href="#" class="text-white mx-2">
        <i class="bi bi-linkedin fs-4"></i>
    </a>

</footer>

</body>
</html>
